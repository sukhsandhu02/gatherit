services:
  # ── Backend: Fastify API Server ──────────────────────────────────────────────
  - type: web
    name: gatherit-server
    runtime: node
    repo: https://github.com/sukhsandhu02/gatherit
    branch: main
    rootDir: .
    buildCommand: npm install && npm --prefix web run build && npm --prefix server run build
    startCommand: npm --prefix server start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://gatherit.onrender.com
      - key: NODE_ENV
        value: production
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BASE_URL
        sync: false

  # ── Frontend: React SPA (Static Site) ────────────────────────────────────────
  - type: web
    name: gatherit-web
    runtime: static
    repo: https://github.com/sukhsandhu02/gatherit
    branch: main
    rootDir: .
    buildCommand: npm install && npm --prefix web run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://gatherit-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
